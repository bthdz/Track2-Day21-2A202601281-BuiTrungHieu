name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python -c "import json; m=json.load(open('outputs/metrics.json')); print(f\"accuracy={m['accuracy']}\")" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = "${{ secrets.CLOUD_BUCKET }}"
          source_file = "models/model.pkl"
          destination_blob_name = "models/latest/model.pkl"

          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob(destination_blob_name)
          blob.upload_from_filename(source_file)
          print(f"File {source_file} uploaded to gs://{bucket_name}/{destination_blob_name}.")
          EOF

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép deploy khi accuracy >= 0.70
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        run: |
          python - <<'EOF'
          import sys

          acc_str = "${{ needs.train.outputs.accuracy }}"
          try:
              acc = float(acc_str)
          except ValueError:
              print(f"Error: invalid accuracy value '{acc_str}'")
              sys.exit(1)

          threshold = 0.70
          print(f"Model accuracy: {acc:.4f} | Threshold: {threshold:.4f}")

          if acc < threshold:
              print(f"Eval gate failed: Accuracy ({acc:.4f}) is below threshold ({threshold:.4f})")
              sys.exit(1)

          print("Eval gate passed! Proceeding to deployment.")
          EOF

  # JOB 4: Triển khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            sleep 5
            curl --fail http://localhost:8000/health
